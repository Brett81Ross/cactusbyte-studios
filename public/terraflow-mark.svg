<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TerraFlow Matrix app mark</title>
  <desc id="desc">Green sprout above flowing cyan irrigation lines inside connected orbital rings.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#0b2630"/>
      <stop offset="0.58" stop-color="#06161d"/>
      <stop offset="1" stop-color="#02070b"/>
    </radialGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ffff6"/>
      <stop offset="0.42" stop-color="#20e8e0"/>
      <stop offset="1" stop-color="#00a9d6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4ff8d"/>
      <stop offset="0.5" stop-color="#8ddb35"/>
      <stop offset="1" stop-color="#2f9b21"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e8e0"/>
      <stop offset="0.66" stop-color="#f3f0dc"/>
      <stop offset="1" stop-color="#b7e44a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bg)" stroke="#235a59" stroke-width="3"/>

  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="253" r="162" stroke="#24dcd7" stroke-width="4" opacity="0.75"/>
    <path d="M118 284c-20-92 33-181 122-205" stroke="url(#aqua)" stroke-width="5" filter="url(#glow)"/>
    <path d="M247 79c91 1 166 72 169 164" stroke="url(#orbit)" stroke-width="5"/>
    <path d="M414 262c-5 90-75 160-164 166" stroke="url(#aqua)" stroke-width="5" filter="url(#glow)"/>
  </g>

  <g fill="#e9edf0" stroke="#7e8d91" stroke-width="2" filter="url(#soft)">
    <circle cx="121" cy="268" r="9"/>
    <circle cx="270" cy="76" r="8"/>
    <circle cx="418" cy="248" r="9"/>
  </g>
  <g fill="#32e8df" filter="url(#glow)">
    <circle cx="163" cy="173" r="6"/>
    <circle cx="251" cy="92" r="6"/>
    <circle cx="390" cy="191" r="6" fill="#b7e44a"/>
    <circle cx="245" cy="422" r="6"/>
  </g>

  <g fill="none" stroke="url(#aqua)" stroke-width="10" stroke-linecap="round" filter="url(#glow)">
    <path d="M121 316c74 48 183 59 274 2"/>
    <path d="M132 338c70 39 169 49 251 4"/>
    <path d="M151 359c59 29 143 36 214 3"/>
    <path d="M177 378c44 18 103 22 157 3"/>
  </g>

  <g filter="url(#soft)">
    <path d="M257 310c-4-66-1-105-2-139" stroke="#4dad27" stroke-width="13" stroke-linecap="round"/>
    <path d="M255 226c-44-47-72-65-115-59 8 46 47 83 105 86" fill="url(#leaf)" stroke="#9cf15f" stroke-width="2"/>
    <path d="M257 225c41-46 71-64 116-58-9 49-46 82-106 86" fill="url(#leaf)" stroke="#9cf15f" stroke-width="2"/>
    <path d="M245 240c-28-33-56-51-88-62" stroke="#245f22" stroke-width="5" stroke-linecap="round"/>
    <path d="M269 239c28-32 54-49 86-61" stroke="#245f22" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
