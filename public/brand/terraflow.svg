<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TerraFlow Matrix icon</title>
  <desc id="desc">Green sprout inside cyan irrigation orbits and flowing water lines on a dark field.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#08232a"/>
      <stop offset=".58" stop-color="#04151d"/>
      <stop offset="1" stop-color="#02070d"/>
    </radialGradient>
    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf7ff"/>
      <stop offset=".46" stop-color="#18d7e8"/>
      <stop offset="1" stop-color="#0799b4"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d6ff73"/>
      <stop offset=".48" stop-color="#7be638"/>
      <stop offset="1" stop-color="#2fae27"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35e6f1"/>
      <stop offset=".58" stop-color="#f2f5ef"/>
      <stop offset="1" stop-color="#b9f557"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="18" y="18" width="476" height="476" rx="92" fill="url(#bg)" stroke="#1b5860" stroke-width="3"/>
