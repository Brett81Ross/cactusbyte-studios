  <circle cx="256" cy="246" r="127" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round" stroke-dasharray="430 370" transform="rotate(-20 256 246)" filter="url(#glow)"/>
  <g fill="#ecf4ee" stroke="#b9d2d2" stroke-width="2" filter="url(#glow)">
