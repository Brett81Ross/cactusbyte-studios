name: Acelynn Synthetic Harness Compile

on:
  push:
    branches:
      - phase7-acelynn-synthetic-transition
    paths:
      - 'tests/synthetic-transition/**'
      - '.github/workflows/acelynn-synthetic-harness-compile.yml'

permissions:
  contents: read

jobs:
  compile-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
      - name: Install Android 36 build tools
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Compile external UiAutomator harness
        shell: bash
        run: gradle -p tests/synthetic-transition assembleDebug assembleDebugAndroidTest --no-daemon
      - name: Confirm isolated compile only
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          echo 'Harness compiled only. No deployment, signing cutover, device uninstall, Supabase change, Play action, or main merge occurred.'
