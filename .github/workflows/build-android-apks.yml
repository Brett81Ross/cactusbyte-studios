name: Build Android APK ecosystem

on:
  workflow_dispatch:
  push:
    branches:
      - apk-icon-fix-v1
      - main
      - release/fantasy-native-splash-v1.0.2
    paths:
      - 'android-packager/**'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Fantasy native splash handoff
        run: python3 android-packager/verify_fantasy_splash.py

      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg

      - name: Build branded launcher icons
        run: python3 android-packager/fetch_icons.py

      - name: Validate CactusByte adaptive icon geometry
        shell: bash
        run: |
          set -euo pipefail
          test -s android-packager/icon-previews/CactusByte-adaptive-preview.png
          python3 - <<'PY'
          from PIL import Image
          p='android-packager/app/src/cactusbyte/res/drawable/app_icon_foreground.png'
          img=Image.open(p).convert('RGBA')
          bbox=img.getchannel('A').getbbox()
          assert bbox, 'CactusByte adaptive foreground is empty'
          w,h=img.size
          l,t,r,b=bbox
          bw,bh=r-l,b-t
          margin=min(l,t,w-r,h-b)
          print('CactusByte foreground:', img.size, 'bbox=', bbox, 'content=', (bw,bh), 'margin=', margin)
          assert margin >= int(w*0.10), f'Adaptive icon unsafe: only {margin}px margin'
          assert bw >= int(w*0.48), f'Adaptive icon too narrow: {bw}px'
          assert bh >= int(h*0.56), f'Adaptive icon too short: {bh}px'
          assert 0.55 <= bw / bh <= 1.35, f'Adaptive icon suspicious aspect ratio: {bw/bh:.2f}'
          PY

      - name: Build release APKs
        run: gradle -p android-packager assembleRelease --stacktrace

      - name: Prepare QA Fantasy signing identity
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          QA_STORE="$RUNNER_TEMP/fantasy-qa-release.p12"
          QA_PASS='fantasy-qa-only-12345'
          keytool -genkeypair -noprompt \
            -keystore "$QA_STORE" -storetype PKCS12 \
            -storepass "$QA_PASS" -keypass "$QA_PASS" \
            -alias fantasy-qa \
            -keyalg RSA -keysize 2048 -sigalg SHA256withRSA -validity 30 \
            -dname 'CN=Fantasy Matrix QA, O=CactusByte Studios, C=US'
          {
            echo "FANTASY_ANDROID_KEYSTORE_PATH=$QA_STORE"
            echo "FANTASY_ANDROID_KEYSTORE_PASSWORD=$QA_PASS"
            echo "FANTASY_ANDROID_KEY_ALIAS=fantasy-qa"
            echo "FANTASY_ANDROID_KEY_PASSWORD=$QA_PASS"
          } >> "$GITHUB_ENV"

      - name: Require permanent Fantasy signing secrets
        if: github.ref == 'refs/heads/main'
        env:
          FANTASY_ANDROID_KEYSTORE_B64: ${{ secrets.FANTASY_ANDROID_KEYSTORE_B64 }}
          FANTASY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FANTASY_ANDROID_KEYSTORE_PASSWORD }}
          FANTASY_ANDROID_KEY_ALIAS: ${{ secrets.FANTASY_ANDROID_KEY_ALIAS }}
          FANTASY_ANDROID_KEY_PASSWORD: ${{ secrets.FANTASY_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in FANTASY_ANDROID_KEYSTORE_B64 FANTASY_ANDROID_KEYSTORE_PASSWORD FANTASY_ANDROID_KEY_ALIAS FANTASY_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing protected GitHub secret: $name"
              exit 1
            fi
          done
          PROD_STORE="$RUNNER_TEMP/fantasy-release.p12"
          printf '%s' "$FANTASY_ANDROID_KEYSTORE_B64" | base64 --decode > "$PROD_STORE"
          chmod 600 "$PROD_STORE"
          {
            echo "FANTASY_ANDROID_KEYSTORE_PATH=$PROD_STORE"
            echo "FANTASY_ANDROID_KEYSTORE_PASSWORD=$FANTASY_ANDROID_KEYSTORE_PASSWORD"
            echo "FANTASY_ANDROID_KEY_ALIAS=$FANTASY_ANDROID_KEY_ALIAS"
            echo "FANTASY_ANDROID_KEY_PASSWORD=$FANTASY_ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build permanently signed Fantasy APK
        env:
          FANTASY_RELEASE_SIGNING: '1'
        run: gradle -p android-packager :app:assembleFantasyRelease --rerun-tasks --stacktrace

      - name: Verify Fantasy APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK='android-packager/app/build/outputs/apk/fantasy/release/app-fantasy-release.apk'
          test -s "$APK"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          VERIFY_OUTPUT="$($APKSIGNER verify --verbose --print-certs "$APK")"
          printf '%s\n' "$VERIFY_OUTPUT"
          echo "$VERIFY_OUTPUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            EXPECTED='CDD191E286F8B40C1C03DF7CBFFA7EF13DFD61749ECD48041E52538D59D14D01'
            ACTUAL="$(echo "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            test "$ACTUAL" = "$EXPECTED"
          fi

      - name: Collect stable APK names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-packager/app/build/outputs/apk/cactusbyte/release/app-cactusbyte-release.apk dist/CactusByte-Studios.apk
          cp android-packager/app/build/outputs/apk/noproblem/release/app-noproblem-release.apk dist/No-Problem-Pressure-Washing-Matrix.apk
          cp android-packager/app/build/outputs/apk/machzero/release/app-machzero-release.apk dist/MachZero.apk
          cp android-packager/app/build/outputs/apk/rapidtakeoff/release/app-rapidtakeoff-release.apk dist/Rapid-Takeoff.apk
          cp android-packager/app/build/outputs/apk/acelynnpro/release/app-acelynnpro-release.apk dist/Acelynn-Pro.apk
          cp android-packager/app/build/outputs/apk/pocketstomp/release/app-pocketstomp-release.apk dist/PocketStomp.apk
          cp android-packager/app/build/outputs/apk/ghostlane/release/app-ghostlane-release.apk dist/GhostLane.apk
          cp android-packager/app/build/outputs/apk/firstbearing/release/app-firstbearing-release.apk dist/First-Bearing.apk
          cp android-packager/app/build/outputs/apk/fantasy/release/app-fantasy-release.apk dist/Fantasy-Football-Matrix.apk
          cp android-packager/app/build/outputs/apk/scouttrace/release/app-scouttrace-release.apk dist/Acelynn-ScoutTrace.apk
          cp android-packager/app/build/outputs/apk/shadownex/release/app-shadownex-release.apk dist/ShadowNex-Prime.apk
          cp android-packager/app/build/outputs/apk/terraflow/release/app-terraflow-release.apk dist/TerraFlow-Matrix.apk
          cp android-packager/app/build/outputs/apk/orbitgather/release/app-orbitgather-release.apk dist/OrbitGather.apk
          cp android-packager/icon-previews/CactusByte-adaptive-preview.png dist/CactusByte-adaptive-preview.png
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish Fantasy APK only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view android-latest >/dev/null
          gh release upload android-latest dist/Fantasy-Football-Matrix.apk --clobber

      - name: Upload QA artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: cactusbyte-android-apks
          path: dist/
          retention-days: 30
