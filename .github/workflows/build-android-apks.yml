name: Build Android APK ecosystem

on:
  workflow_dispatch:
  push:
    branches:
      - apk-icon-fix-v1
      - main
    paths:
      - 'android-packager/**'
      - '.github/workflows/build-android-apks.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg

      - name: Build branded launcher icons
        run: python3 android-packager/fetch_icons.py

      - name: Validate CactusByte adaptive icon geometry
        shell: bash
        run: |
          set -euo pipefail
          test -s android-packager/icon-previews/CactusByte-adaptive-preview.png
          python3 - <<'PY'
          from PIL import Image
          p='android-packager/app/src/cactusbyte/res/drawable/app_icon_foreground.png'
          img=Image.open(p).convert('RGBA')
          bbox=img.getchannel('A').getbbox()
          assert bbox, 'CactusByte adaptive foreground is empty'
          w,h=img.size
          l,t,r,b=bbox
          bw,bh=r-l,b-t
          margin=min(l,t,w-r,h-b)
          print('CactusByte foreground:', img.size, 'bbox=', bbox, 'content=', (bw,bh), 'margin=', margin)
          assert margin >= int(w*0.10), f'Adaptive icon unsafe: only {margin}px margin'
          assert bw >= int(w*0.48), f'Adaptive icon too narrow: {bw}px'
          assert bh >= int(h*0.56), f'Adaptive icon too short: {bh}px'
          assert 0.55 <= bw / bh <= 1.35, f'Adaptive icon suspicious aspect ratio: {bw/bh:.2f}'
          PY

      - name: Build direct release APKs
        run: gradle -p android-packager assembleDirectRelease --stacktrace

      - name: Collect stable direct APK names
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-packager/app/build/outputs/apk/cactusbyteDirect/release/app-cactusbyte-direct-release.apk dist/CactusByte-Studios.apk
          cp android-packager/app/build/outputs/apk/noproblemDirect/release/app-noproblem-direct-release.apk dist/No-Problem-Pressure-Washing-Matrix.apk
          cp android-packager/app/build/outputs/apk/machzeroDirect/release/app-machzero-direct-release.apk dist/MachZero.apk
          cp android-packager/app/build/outputs/apk/rapidtakeoffDirect/release/app-rapidtakeoff-direct-release.apk dist/Rapid-Takeoff.apk
          cp android-packager/app/build/outputs/apk/acelynnproDirect/release/app-acelynnpro-direct-release.apk dist/Acelynn-Pro.apk
          cp android-packager/app/build/outputs/apk/pocketstompDirect/release/app-pocketstomp-direct-release.apk dist/PocketStomp.apk
          cp android-packager/app/build/outputs/apk/ghostlaneDirect/release/app-ghostlane-direct-release.apk dist/GhostLane.apk
          cp android-packager/app/build/outputs/apk/firstbearingDirect/release/app-firstbearing-direct-release.apk dist/First-Bearing.apk
          cp android-packager/app/build/outputs/apk/fantasyDirect/release/app-fantasy-direct-release.apk dist/Fantasy-Football-Matrix.apk
          cp android-packager/app/build/outputs/apk/scouttraceDirect/release/app-scouttrace-direct-release.apk dist/Acelynn-ScoutTrace.apk
          cp android-packager/app/build/outputs/apk/shadownexDirect/release/app-shadownex-direct-release.apk dist/ShadowNex-Prime.apk
          cp android-packager/app/build/outputs/apk/terraflowDirect/release/app-terraflow-direct-release.apk dist/TerraFlow-Matrix.apk
          cp android-packager/app/build/outputs/apk/orbitgatherDirect/release/app-orbitgather-direct-release.apk dist/OrbitGather.apk
          cp android-packager/icon-previews/CactusByte-adaptive-preview.png dist/CactusByte-adaptive-preview.png
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish stable APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete android-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create android-latest dist/*.apk dist/SHA256SUMS.txt \
            --target "${GITHUB_SHA}" \
            --title "CactusByte Android Apps — Latest" \
            --notes "Real Android APK packages for the CactusByte Studios ecosystem. These artifacts are the direct-install distribution channel and may include direct-only capabilities such as package installation for self-update. Play-channel APKs are not published by this workflow."

      - name: Upload QA artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: cactusbyte-android-apks
          path: dist/
          retention-days: 30
