name: Acelynn Pro 1.2.4 Microphone Hotfix Gate

on:
  workflow_dispatch:
  # 1.2.4 repair gate refresh

permissions:
  contents: read

jobs:
  play-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CACTUSBYTE_PERMANENT_SIGNING: '0'
      CACTUSBYTE_SIGNING_FLAVORS: 'acelynnpro'
      CACTUSBYTE_ICON_FLAVORS: 'acelynnpro'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify runner Gradle
        run: gradle --version
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg
      - name: Build branded launcher icons
        run: python3 android-packager/fetch_icons.py
      - name: Build Acelynn Play release AAB
        run: |
          gradle --no-daemon -p android-packager :app:bundleAcelynnproPlayRelease :app:assembleAcelynnproPlayRelease --stacktrace
          mapfile -t apks < <(find android-packager/app/build/outputs/apk -type f -iname '*acelynnpro*play*release*.apk' | sort)
          test "${#apks[@]}" -eq 1
          echo "APK=${apks[0]}" >> "$GITHUB_ENV"
      - name: Verify production export bridge wiring
        shell: bash
        run: |
          set -euo pipefail
          src=android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java
          grep -Fq 'webView.addJavascriptInterface(new AcelynnExportBridge(), "CactusAcelynnBridge")' "$src"
          grep -Fq 'if (acelynnProductionMode && isTrustedAcelynnProductionUrl(url))' "$src"
          grep -Fq 'installAcelynnExportHooks();' "$src"
          grep -Fq 'if (acelynnProductionMode && url != null && url.startsWith("blob:"))' "$src"
          grep -Fq 'ACELYNN_PRODUCTION_HOST.equalsIgnoreCase(host)' "$src"
          echo "Production export bridge is attached, installed, blob-routed, and host-restricted."
      - name: Locate QA AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find android-packager/app/build/outputs/bundle -type f -iname '*acelynnpro*play*release*.aab' | sort)
          test "${#aabs[@]}" -eq 1
          echo "AAB=${aabs[0]}" >> "$GITHUB_ENV"
          test -f "$APK"
          echo "Hotfix QA artifacts built with non-production signing mode; permanent Play signing remains isolated."
      - name: Verify configured Play identity and API level
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.cactusbyte.acelynnpro"' android-packager/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android-packager/app/build.gradle.kts
          grep -Fq 'compileSdk = 36' android-packager/app/build.gradle.kts
          grep -Fq 'versionCode = 7' android-packager/app/build.gradle.kts
          grep -Fq 'versionName = "1.2.4"' android-packager/app/build.gradle.kts
          grep -Fq 'create("play")' android-packager/app/build.gradle.kts
      - name: Verify Acelynn Play merged permission surface
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find android-packager/app/build/intermediates -type f -path '*acelynnproPlayRelease*' -name AndroidManifest.xml | head -n1)"
          test -n "$manifest"
          grep -Fq 'android.permission.RECORD_AUDIO' "$manifest"
          for p in android.permission.CAMERA android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION android.permission.POST_NOTIFICATIONS; do
            ! grep -Fq "$p" "$manifest"
          done
      - name: Verify Acelynn microphone permission bridge hotfix
        shell: bash
        run: |
          set -euo pipefail
          src=android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java
          grep -Fq 'private boolean requestsAcelynnAudio(PermissionRequest request)' "$src"
          grep -Fq 'PermissionRequest.RESOURCE_AUDIO_CAPTURE.equals(resource)' "$src"
          grep -Fq 'request.grant(new String[]{PermissionRequest.RESOURCE_AUDIO_CAPTURE})' "$src"
          grep -Fq 'boolean granted = grantResults.length > 0;' "$src"
          ! grep -Fq 'requestsOnlyAcelynnAudio' "$src"
          grep -Fq 'ensureAcelynnMicrophonePermission();' "$src"
          grep -Fq 'REQUEST_ACELYNN_MICROPHONE' "$src"
          grep -Fq 'ActivityCompat.shouldShowRequestPermissionRationale(this, Manifest.permission.RECORD_AUDIO)' "$src"
          grep -Fq 'Settings.ACTION_APPLICATION_DETAILS_SETTINGS' "$src"
          grep -Fq 'showAcelynnMicrophoneSettingsDialog();' "$src"
          grep -Fq 'Acelynn Pro needs Android microphone permission for Live Analysis.' "$src"
          echo "Acelynn microphone bridge, native preflight, and permanent-denial recovery are present."

      - name: No-deploy guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          test "$GITHUB_REF_NAME" = 'hotfix-acelynn-play-microphone-v1-2-4'
          test "$CACTUSBYTE_PERMANENT_SIGNING" = '0'
          echo "Hotfix QA validation only; no permanent signing, Vercel deployment, production merge, or Play publication."
      - name: Upload Play RC AAB and evidence
        uses: actions/upload-artifact@v4
        with:
          name: acelynn-pro-play-v1.2.4-microphone-hotfix-qa
          path: |
            ${{ env.AAB }}
            ${{ env.APK }}
          retention-days: 14
      - name: Gate passed
        run: echo "Acelynn Pro Play v1.2.4 microphone hotfix QA gate passed."

# QA trigger: isolated Acelynn 1.2.4 microphone hotfix build
