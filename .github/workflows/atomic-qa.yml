name: CactusByte Atomic QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cactusbyte-atomic-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install media probe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Audit all 60-second demo MP4s
        run: python3 scripts/qa_demo_media.py
      - name: Run atomic preflight and production build
        run: npm run preflight
      - name: Install responsive QA browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run Fold, Android, and iPhone responsive QA
        run: npm run qa:responsive
