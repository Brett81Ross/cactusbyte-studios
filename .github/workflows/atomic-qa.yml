name: CactusByte Atomic QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cactusbyte-atomic-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify media probe\n        run: |\n          command -v ffprobe >/dev/null 2>&1 || { echo "ffprobe is required but missing from the GitHub runner"; exit 1; }\n          ffprobe -version | head -n 1
      - name: Audit all 60-second demo MP4s
        run: python3 scripts/qa_demo_media.py
      - name: Verify SchismMatrix native branding
        run: python3 android-packager/verify_schismmatrix_branding.py

      - name: Run atomic preflight and production build
        run: npm run preflight
      - name: Install responsive QA browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Run Fold, Android, and iPhone responsive QA
        run: npm run qa:responsive
      - name: Keep CactusByte storefront visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cactusbyte-storefront-visual-qa
          path: /tmp/cactusbyte-storefront-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep Acelynn beta visual QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acelynn-beta-visual-qa
          path: /tmp/acelynn-beta-*.png
          if-no-files-found: ignore
          retention-days: 7
