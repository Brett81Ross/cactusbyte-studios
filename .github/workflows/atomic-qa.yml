name: CactusByte Atomic QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cactusbyte-atomic-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run atomic preflight and production build
        run: npm run preflight
