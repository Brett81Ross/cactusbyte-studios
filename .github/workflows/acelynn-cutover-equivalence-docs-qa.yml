name: Acelynn Cutover Equivalence Docs QA

on:
  push:
    branches:
      - phase7-acelynn-cutover-equivalence-docs
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout documentation branch
        uses: actions/checkout@v5
        with:
          ref: phase7-acelynn-cutover-equivalence-docs
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic documentation reconciliation
        run: python3 tools/reconcile-acelynn-cutover-equivalence-docs.py
      - name: Verify documentation-only generated diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected=$'ATOMIC_BUILD_LIST.md\nandroid-packager/SIGNING_CUTOVER_DATA_AUDIT.md\nandroid-packager/SIGNING_CUTOVER_RUNBOOK.md'
          test "$changed" = "$expected"
          grep -Fq 'production-cutover equivalence gate' ATOMIC_BUILD_LIST.md
          grep -Fq 'physical Z Fold recovery-engine QA complete' android-packager/SIGNING_CUTOVER_DATA_AUDIT.md
          grep -Fq 'production-cutover equivalence gate' android-packager/SIGNING_CUTOVER_RUNBOOK.md
          ! grep -Fq 'The current source still registers `sw.js`' android-packager/SIGNING_CUTOVER_DATA_AUDIT.md
      - name: Run CactusByte preflight without deployment
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run preflight
      - name: Verify no deployment or cutover side effects
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          echo 'Documentation-only reconciliation: no deployment, APK install, uninstall, signing cutover, or main merge executed.'
      - name: Commit reconciled documentation if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Acelynn cutover-equivalence documentation already settled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ATOMIC_BUILD_LIST.md android-packager/SIGNING_CUTOVER_DATA_AUDIT.md android-packager/SIGNING_CUTOVER_RUNBOOK.md
          git commit -m 'docs: reconcile Acelynn cutover equivalence gate'
          git push origin HEAD:phase7-acelynn-cutover-equivalence-docs
