name: Acelynn Mic Hotfix QA

on:
  push:
    branches:
      - phase7-acelynn-mic-permission-hotfix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mic-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CACTUSBYTE_PERMANENT_SIGNING: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Acelynn QA source contract
        run: node tools/qa-acelynn-physical-qa.mjs

      - name: Build replacement QA APK
        run: gradle -p android-packager :app:assembleAcelynnproQaDebug --stacktrace

      - name: Verify QA launcher, permissions, package, and debug signer
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android-packager/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -Fq "package: name='com.cactusbyte.acelynnpro.qa'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "application-label:'Acelynn Pro QA'" "$RUNNER_TEMP/badging.txt"
          grep -Fq "launchable-activity: name='com.cactusbyte.wrapper.QaMainActivity'" "$RUNNER_TEMP/badging.txt"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          grep -Fq "android.permission.RECORD_AUDIO" "$RUNNER_TEMP/permissions.txt"
          grep -Fq "android.permission.MODIFY_AUDIO_SETTINGS" "$RUNNER_TEMP/permissions.txt"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signer.txt"
          grep -Eq 'certificate DN: .*CN=Android Debug' "$RUNNER_TEMP/signer.txt"
          echo "QA_APK=$APK" >> "$GITHUB_ENV"

      - name: Verify pinned assets remain unchanged
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 "$QA_APK" | grep -F 'assets/acelynnqa/index.html'
          unzip -Z1 "$QA_APK" | grep -F 'assets/acelynnqa/acelynn-recovery.js'
          ! unzip -Z1 "$QA_APK" | grep -Fq 'assets/acelynnqa/sw.js'
          ! unzip -p "$QA_APK" classes.dex | strings | grep -Fq 'https://acelynn.vercel.app'

      - name: Upload replacement QA APK
        uses: actions/upload-artifact@v4
        with:
          name: acelynn-pro-mic-hotfix-qa-apk
          path: ${{ env.QA_APK }}
          retention-days: 7
          if-no-files-found: error
