name: Generate App Demo Videos

on:
  push:
    branches: [main]
    paths:
      - scripts/generate_demo_videos.py
      - .github/workflows/generate-demo-videos.yml

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[demo-assets]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          python -m pip install pillow
      - name: Render 13 app-specific 60-second demos
        run: python scripts/generate_demo_videos.py
      - name: Commit generated MP4 assets
        run: |
          git config user.name "CactusByte Demo Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/demos/*.mp4
          if git diff --cached --quiet; then
            echo "Demo assets already current."
            exit 0
          fi
          git commit -m "[demo-assets] Add 60-second app demo videos"
          git push
