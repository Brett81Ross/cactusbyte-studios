name: Acelynn Pro 1.2.5 Runtime Microphone RC

on:
  workflow_dispatch:
  push:
    branches: [fix-acelynn-play-audio-permission-investigation]
    paths:
      - 'android-packager/**'
      - 'vercel.json'
      - '.github/workflows/acelynn-play-v1-2-5-runtime.yml'

permissions:
  contents: read

jobs:
  play-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: android-release
    env:
      CACTUSBYTE_PERMANENT_SIGNING: '1'
      CACTUSBYTE_SIGNING_FLAVORS: 'acelynnpro'
      CACTUSBYTE_ICON_FLAVORS: 'acelynnpro'
      KEYSTORE_ACELYNNPRO: ${{ secrets.KEYSTORE_ACELYNNPRO }}
      KEYSTORE_PASSWORD_ACELYNNPRO: ${{ secrets.KEYSTORE_PASSWORD_ACELYNNPRO }}
      KEY_PASSWORD_ACELYNNPRO: ${{ secrets.KEY_PASSWORD_ACELYNNPRO }}
      KEY_ALIAS_ACELYNNPRO: ${{ secrets.KEY_ALIAS_ACELYNNPRO }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify runner Gradle
        run: gradle --version
      - name: Materialize Acelynn permanent signing key
        shell: bash
        run: |
          set -euo pipefail
          for v in KEYSTORE_ACELYNNPRO KEYSTORE_PASSWORD_ACELYNNPRO KEY_PASSWORD_ACELYNNPRO KEY_ALIAS_ACELYNNPRO; do
            test -n "${!v:-}" || { echo "Missing $v" >&2; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/cactusbyte-signing"
          path="$RUNNER_TEMP/cactusbyte-signing/acelynnpro.jks"
          printf '%s' "$KEYSTORE_ACELYNNPRO" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "KEYSTORE_PATH_ACELYNNPRO=$path" >> "$GITHUB_ENV"
      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg
      - name: Build branded launcher icons
        run: python3 android-packager/fetch_icons.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify real WebView microphone capture on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none -camera-front none
          script: gradle --no-daemon -p android-packager :app:connectedAcelynnproPlayDebugAndroidTest --stacktrace
      - name: Build Acelynn Play release AAB
        run: |
          gradle --no-daemon -p android-packager :app:bundleAcelynnproPlayRelease :app:assembleAcelynnproPlayRelease --stacktrace
          mapfile -t apks < <(find android-packager/app/build/outputs/apk -type f -iname '*acelynnpro*play*release*.apk' | sort)
          test "${#apks[@]}" -eq 1
          echo "APK=${apks[0]}" >> "$GITHUB_ENV"
      - name: Verify production export bridge wiring
        shell: bash
        run: |
          set -euo pipefail
          src=android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java
          grep -Fq 'webView.addJavascriptInterface(new AcelynnExportBridge(), "CactusAcelynnBridge")' "$src"
          grep -Fq 'if (acelynnProductionMode && isTrustedAcelynnProductionUrl(url))' "$src"
          grep -Fq 'installAcelynnExportHooks();' "$src"
          grep -Fq 'if (acelynnProductionMode && url != null && url.startsWith("blob:"))' "$src"
          grep -Fq 'ACELYNN_PRODUCTION_HOST.equalsIgnoreCase(host)' "$src"
          echo "Production export bridge is attached, installed, blob-routed, and host-restricted."
      - name: Validate dogfood APK signer
        shell: bash
        run: |
          set -euo pipefail
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/apk-signer.txt"
          actual="$("$APKSIGNER" verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/{print $NF; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected='FA956BB761F59AAD38FAEF4F4F561FBF8EB05C1A7CB6DD0E30C12D52CC153230'
          echo "Dogfood APK signer actual: $actual"
          test -n "$actual"
          test "$actual" = "$expected"
          echo "Dogfood APK permanent signer verified: $actual"
      - name: Validate AAB signer
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t aabs < <(find android-packager/app/build/outputs/bundle -type f -iname '*acelynnpro*play*release*.aab' | sort)
          test "${#aabs[@]}" -eq 1
          AAB="${aabs[0]}"
          jarsigner -verify -verbose -certs "$AAB" > "$RUNNER_TEMP/jarsigner.txt"
          jarsigner -verify "$AAB"
          keytool -printcert -jarfile "$AAB" -rfc > "$RUNNER_TEMP/aab-cert.pem"
          actual="$(keytool -printcert -file "$RUNNER_TEMP/aab-cert.pem" | awk -F': ' '/SHA256:/{gsub(":","",$2);print toupper($2);exit}')"
          expected='FA956BB761F59AAD38FAEF4F4F561FBF8EB05C1A7CB6DD0E30C12D52CC153230'
          test "$actual" = "$expected"
          echo "AAB=$AAB" >> "$GITHUB_ENV"
          echo "Acelynn Play AAB permanent signer verified: $actual"
      - name: Verify configured Play identity and API level
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.cactusbyte.acelynnpro"' android-packager/app/build.gradle.kts
          grep -Fq 'targetSdk = 36' android-packager/app/build.gradle.kts
          grep -Fq 'compileSdk = 36' android-packager/app/build.gradle.kts
          grep -Fq 'versionCode = 8' android-packager/app/build.gradle.kts
          grep -Fq 'versionName = "1.2.5"' android-packager/app/build.gradle.kts
          grep -Fq 'create("play")' android-packager/app/build.gradle.kts
      - name: Verify Acelynn Play merged permission surface
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find android-packager/app/build/intermediates -type f -path '*acelynnproPlayRelease*' -name AndroidManifest.xml | head -n1)"
          test -n "$manifest"
          grep -Fq 'android.permission.RECORD_AUDIO' "$manifest"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$manifest"
          for p in android.permission.CAMERA android.permission.ACCESS_FINE_LOCATION android.permission.ACCESS_COARSE_LOCATION android.permission.POST_NOTIFICATIONS; do
            ! grep -Fq "$p" "$manifest"
          done
      - name: No-deploy guard
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          test "$GITHUB_REF_NAME" = 'fix-acelynn-play-audio-permission-investigation'
          echo "RC validation only; no Vercel deployment, production merge, or Play publication."
      - name: Upload Play RC AAB and evidence
        uses: actions/upload-artifact@v4
        with:
          name: acelynn-pro-play-v1.2.5-microphone-hotfix-signed-rc
          path: |
            ${{ env.AAB }}
            ${{ env.APK }}
            ${{ runner.temp }}/jarsigner.txt
            ${{ runner.temp }}/apk-signer.txt
          retention-days: 14
      - name: Save runtime test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acelynn-pro-1.2.5-runtime-evidence
          path: |
            android-packager/app/build/reports/androidTests/
            android-packager/app/build/outputs/androidTest-results/
          retention-days: 14
      - name: Emulator gate passed; physical gate remains required
        run: echo "Emulator capture and packaging passed. Physical-device approval is still required; do not upload to Play yet."
