name: Ecosystem production viewport QA

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1'

permissions:
  contents: read

jobs:
  production-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CACTUSBYTE_PRODUCTION_QA: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Sweep all 13 production apps
        run: npm run qa:viewport

      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ecosystem-production-viewport-failures
          path: |
            playwright-report/
            test-results/
          retention-days: 14
