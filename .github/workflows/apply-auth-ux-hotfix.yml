name: Apply CactusByte Auth UX Hotfix

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-auth-ux-hotfix.mjs
      - .github/workflows/apply-auth-ux-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch auth restoration UX
        run: node scripts/apply-auth-ux-hotfix.mjs
      - name: Commit patch and remove one-time helper
        run: |
          git config user.name "CactusByte QA Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/page.tsx
          git rm scripts/apply-auth-ux-hotfix.mjs .github/workflows/apply-auth-ux-hotfix.yml
          git commit -m "Fix false sign-in state during CactusByte ID restoration"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
