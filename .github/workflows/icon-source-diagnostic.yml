name: CactusByte icon source diagnostic

on:
  push:
    branches:
      - apk-icon-fix-v1
    paths:
      - '.github/workflows/icon-source-diagnostic.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch CactusByte logo history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p icon-history
          curl -fL -H 'Accept-Encoding: identity' 'https://raw.githubusercontent.com/Brett81Ross/cactusbyte-studios/9c7c5df9631f8358bfff7a29b47573d6f05135a5/logo2.png' -o icon-history/logo2-9c7c5d.png || true
          curl -fL -H 'Accept-Encoding: identity' 'https://raw.githubusercontent.com/Brett81Ross/cactusbyte-studios/6b08443bffc7f269e64c9de51672befe8567d606/logo2.png' -o icon-history/logo2-6b0844.png || true
          curl -fL -H 'Accept-Encoding: identity' 'https://raw.githubusercontent.com/Brett81Ross/cactusbyte-studios/16f9efbb424d449a02a9391510b920698dd5222e/logo2.png' -o icon-history/logo2-16f9ef.png || true
          curl -fL -H 'Accept-Encoding: identity' 'https://cactusbyte-studios.vercel.app/logo2.png' -o icon-history/logo2-current.png
          find icon-history -type f -maxdepth 1 -print -exec file {} \;
      - name: Upload source history for visual QA
        uses: actions/upload-artifact@v4
        with:
          name: cactusbyte-icon-history
          path: icon-history/
          retention-days: 1
