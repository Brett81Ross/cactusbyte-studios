name: Acelynn Direct Recovery Fallback QA
# deterministic settle rerun after generated wrapper commit

on:
  push:
    branches:
      - phase7-acelynn-direct-recovery-fallback
  workflow_dispatch:

permissions:
  contents: write

jobs:
  direct-recovery-fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CACTUSBYTE_PERMANENT_SIGNING: '0'

    steps:
      - name: Checkout isolated fallback branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply or verify Acelynn Direct same-origin recovery fallback
        shell: bash
        run: |
          set -euo pipefail
          main='android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java'
          if grep -Fq 'ACELYNN_RECOVERY_PATH = "/__cactusbyte_recovery__/"' "$main" && \
             grep -Fq 'Built-in Recovery · certified 6363059183ce' "$main"; then
            echo 'Acelynn Direct same-origin recovery fallback already settled.'
          else
            python3 tools/apply-acelynn-direct-recovery-fallback.py
          fi

      - name: Verify source contract and certified asset identity
        run: node tools/qa-acelynn-direct-recovery-fallback.mjs

      - name: Verify generated diff is empty or shared wrapper logic only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected='android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java'
          if [[ -n "$changed" && "$changed" != "$expected" ]]; then
            echo "Unexpected generated changes:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          if [[ -z "$changed" ]]; then
            echo 'Generated Acelynn Direct fallback already settled.'
          fi

      - name: Install icon tooling
        run: python3 -m pip install --disable-pip-version-check pillow cairosvg

      - name: Build branded launcher icons
        run: python3 android-packager/fetch_icons.py

      - name: Build Acelynn Direct and Play debug APKs
        run: gradle -p android-packager :app:assembleAcelynnproDirectDebug :app:assembleAcelynnproPlayDebug --stacktrace

      - name: Locate Direct and Play APKs
        shell: bash
        run: |
          set -euo pipefail
          direct="$(find android-packager/app/build/outputs/apk -type f -iname '*acelynnpro*direct*debug*.apk' -print -quit)"
          play="$(find android-packager/app/build/outputs/apk -type f -iname '*acelynnpro*play*debug*.apk' -print -quit)"
          test -n "$direct"
          test -n "$play"
          echo "DIRECT_APK=$direct" >> "$GITHUB_ENV"
          echo "PLAY_APK=$play" >> "$GITHUB_ENV"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"
          printf 'Direct: %s\nPlay: %s\n' "$direct" "$play"

      - name: Verify Direct-only certified fallback packaging
        shell: bash
        run: |
          set -euo pipefail
          unzip -Z1 "$DIRECT_APK" > "$RUNNER_TEMP/direct-files.txt"
          unzip -Z1 "$PLAY_APK" > "$RUNNER_TEMP/play-files.txt"
          grep -Fxq 'assets/index.html' "$RUNNER_TEMP/direct-files.txt"
          grep -Fxq 'assets/acelynn-recovery.js' "$RUNNER_TEMP/direct-files.txt"
          ! grep -Fxq 'assets/index.html' "$RUNNER_TEMP/play-files.txt"
          ! grep -Fxq 'assets/acelynn-recovery.js' "$RUNNER_TEMP/play-files.txt"
          unzip -p "$DIRECT_APK" assets/index.html > "$RUNNER_TEMP/direct-index.html"
          unzip -p "$DIRECT_APK" assets/acelynn-recovery.js > "$RUNNER_TEMP/direct-recovery.js"
          cmp android-packager/app/src/acelynnproDirect/assets/index.html "$RUNNER_TEMP/direct-index.html"
          cmp android-packager/app/src/acelynnproDirect/assets/acelynn-recovery.js "$RUNNER_TEMP/direct-recovery.js"
          test "$(git hash-object "$RUNNER_TEMP/direct-index.html")" = 'f61201e13b6e001f49d0718b33a4072e6bf7704f'
          test "$(git hash-object "$RUNNER_TEMP/direct-recovery.js")" = '2f29bec84322b3e457cf41162ae970d7907b5f31'
          echo 'Direct APK contains the exact certified recovery assets; Play APK does not.'

      - name: Verify Direct-only audio-settings permission and production URL
        shell: bash
        run: |
          set -euo pipefail
          "$AAPT" dump permissions "$DIRECT_APK" > "$RUNNER_TEMP/direct-permissions.txt"
          "$AAPT" dump permissions "$PLAY_APK" > "$RUNNER_TEMP/play-permissions.txt"
          grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$RUNNER_TEMP/direct-permissions.txt"
          ! grep -Fq 'android.permission.MODIFY_AUDIO_SETTINGS' "$RUNNER_TEMP/play-permissions.txt"
          direct_config="$(find android-packager/app/build/generated -type f -name BuildConfig.java -ipath '*acelynnpro*direct*debug*' -print -quit)"
          play_config="$(find android-packager/app/build/generated -type f -name BuildConfig.java -ipath '*acelynnpro*play*debug*' -print -quit)"
          test -n "$direct_config"
          test -n "$play_config"
          grep -Fq 'CHANNEL = "direct"' "$direct_config"
          grep -Fq 'START_URL = "https://acelynn.vercel.app/"' "$direct_config"
          grep -Fq 'CHANNEL = "play"' "$play_config"
          grep -Fq 'START_URL = "https://acelynn.vercel.app/"' "$play_config"
          echo 'Normal production URL remains unchanged; only Direct carries the local fallback.'

      - name: Run full CactusByte preflight without deployment
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run preflight

      - name: Reject deployment cutover and signing side effects
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '"deploymentEnabled"[[:space:]]*:[[:space:]]*false' vercel.json
          test ! -d .vercel/output
          test "$CACTUSBYTE_PERMANENT_SIGNING" = '0'
          if find . -type f \( -name '*.jks' -o -name '*.keystore' -o -name '*.p12' -o -name '*.pfx' \) -print -quit | grep -q .; then
            echo 'Private signing material must not be present.' >&2
            exit 1
          fi
          echo 'No Vercel deployment, Supabase change, permanent signing, APK install, uninstall, Play publication, or main merge executed.'

      - name: Commit generated fallback wrapper if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java; then
            echo 'Acelynn Direct recovery fallback already settled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-packager/app/src/main/java/com/cactusbyte/wrapper/MainActivity.java
          git commit -m 'phase7: enable Acelynn Direct same-origin recovery fallback'
          git push origin HEAD:phase7-acelynn-direct-recovery-fallback
